name: Prepare release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev librsvg2-bin python3-bs4 libarchive-tools
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Build target and test bundled runtime
        env:
          RCC: /usr/lib/qt6/libexec/rcc
          RESTORE_ARCH: ${{ matrix.arch }}
          RESTORE_ARCHIVE: '0'
        run: |
          ./scripts/build.sh
          if [ "$RESTORE_ARCH" = armv7 ]; then
            # QEMU's renderer closed during session creation. Check ABI/dependencies
            # here; full ARMv7 browser coverage runs on physical hardware.
            ./scripts/runtime-smoke.sh "$RESTORE_ARCH" --dependencies-only
          else
            ./scripts/runtime-smoke.sh "$RESTORE_ARCH"
          fi
  package:
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev librsvg2-bin python3-bs4 libarchive-tools
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF#refs/tags/v}" = "$(cat VERSION)"
      - name: Build release assets
        env:
          RCC: /usr/lib/qt6/libexec/rcc
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reStore-release
          path: dist/release/*
          if-no-files-found: error
